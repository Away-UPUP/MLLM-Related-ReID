name: Update paper list

on:
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-papers.yml'
      - 'scripts/discover_papers.py'
      - 'scripts/reviewed_titles.txt'

permissions:
  contents: write

concurrency:
  group: update-paper-list
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - name: Discover papers and update README
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch --no-tags origin main
            git switch --detach origin/main
            python3 scripts/discover_papers.py
            if git diff --quiet -- README.md; then
              exit 0
            fi
            git add -- README.md
            git commit -m 'Add newly discovered ReID papers'
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 5
            fi
          done
          exit 1
